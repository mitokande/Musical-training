<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{TITLE}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Brand faces declared once on the host document — the runtime clones
         sub-composition markup into this page, so every frame resolves them
         without re-fetching. Each frame also declares its own so it stays
         self-contained under snapshot. */
      @font-face{font-family:"Plus Jakarta Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/plus-jakarta-sans-latin-400-normal.woff2") format("woff2");}
      @font-face{font-family:"Plus Jakarta Sans";font-weight:600;font-style:normal;font-display:block;src:url("assets/fonts/plus-jakarta-sans-latin-600-normal.woff2") format("woff2");}
      @font-face{font-family:"Plus Jakarta Sans";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2");}
      @font-face{font-family:"Plus Jakarta Sans";font-weight:800;font-style:normal;font-display:block;src:url("assets/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2");}
      @font-face{font-family:"Instrument Serif";font-weight:400;font-style:italic;font-display:block;src:url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");}
      @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");}

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; background: #0C0A10; }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0C0A10;
      }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!--
      GENERATED by App\Services\AdStudio\AdProjectBuilder. Frame windows and
      audio cue times below are computed by AdTimingPlanner from the MEASURED
      Gemini TTS durations in assets/audio/vo.json — that measurement is what
      makes a 30s target actually land on 30s when the copy changes.

      Hard cuts throughout, on one track. No crossfade anywhere: a dissolve at
      this pace reads as a mistake.
    -->
    <div
      id="root"
      data-composition-id="root"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="{{TOTAL}}"
    >
{{FRAME_CLIPS}}

      <!-- Narration — one clip per script line, at the global time its frame
           plays. Gemini TTS, silence-trimmed; durations from vo.json. -->
{{VO_CLIPS}}

      <!-- The questions, as sound. Every file is two notes with the second a
           fixed 0.85s after the first, so a difficulty ramp is heard as the
           interval changing rather than the register moving (scripts/tones.mjs).
           Each starts at the global time its frame's first note head lands. -->
{{SFX_CLIPS}}

      <!-- Music bed, normalized low so narration always sits on top. -->
{{BGM_CLIP}}
    </div>

    <script>
      // All motion lives in the scene sub-compositions; the root timeline stays empty.
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
